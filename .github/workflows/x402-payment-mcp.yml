name: x402-payment-mcp

on:
  pull_request:
    paths:
      - ".github/workflows/x402-payment-mcp.yml"
      - "x402-payment-mcp/**"
  push:
    paths:
      - ".github/workflows/x402-payment-mcp.yml"
      - "x402-payment-mcp/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x402-payment-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck and tests (with Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Wallet ledger tests (single-use previews, advisory locks, cancellation
      # replacement, interrupted-operation release) skip without a database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: x402
          POSTGRES_PASSWORD: x402
          POSTGRES_DB: x402_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x402 -d x402_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://x402:x402@localhost:5432/x402_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: x402-payment-mcp/package-lock.json

      - name: Install
        working-directory: x402-payment-mcp
        run: npm ci

      - name: Typecheck
        working-directory: x402-payment-mcp
        run: npm run check

      # shell: bash enables pipefail, so tee cannot hide a failing test run.
      - name: Test
        working-directory: x402-payment-mcp
        shell: bash
        run: npm test 2>&1 | tee test-output.txt

      # Every skip in this suite is a database test; a missing or broken
      # TEST_DATABASE_URL would otherwise pass CI with the ledger untested.
      - name: Require database tests to have run
        working-directory: x402-payment-mcp
        shell: bash
        run: |
          if ! grep -Eq "^ℹ skipped 0$" test-output.txt; then
            grep -E "# SKIP|^ℹ skipped" test-output.txt >&2 || true
            echo "Some tests were skipped" >&2
            exit 1
          fi
